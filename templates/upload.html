<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Receipt - BillSplitter+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h2>📄 Upload Receipt for Group #{{ group_id }}</h2>

    <form action="{{ url_for('upload.upload_receipt', group_id=group_id) }}" method="post" enctype="multipart/form-data">
      <label for="receipt">Select Image File:</label>
      <input type="file" name="receipt_image" accept="image/*" required>
      <button type="submit">Upload and Continue</button>
    </form>

    <hr>

    <div class="alt-option">
      <p>Don't have a receipt?</p>
      <form action="{{ url_for('main.manual_form', group_id=group_id) }}" method="get">
        <button type="submit">Continue Without Uploading</button>
      </form>
    </div>
  </div>
</body>
</html>
