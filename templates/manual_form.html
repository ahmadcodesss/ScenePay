<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Manual Entry Form - BillSplitter+</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 20px;
      background-color: #f5f8fa;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    form {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .member-block {
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 6px;
      background: #f9f9f9;
    }

    .member-block label {
      font-weight: bold;
    }

    .item-entry {
      margin-top: 10px;
    }

    input[type="text"],
    input[type="number"],
    select {
      width: 90%;
      padding: 6px;
      margin-top: 4px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    hr {
      margin: 30px 0;
    }
  </style>
</head>

<body>
  <h2>✍️ Manually Add Bill Details for Group: {{ group.name }}</h2>

  <form method="post" action="{{ url_for('main.manual_form', group_id=group_id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    {% for i in range(group.num_members) %}
    <div class="member-block" id="member-block-{{ i }}">
      <label>👤 Member {{ i + 1 }} Username or Guest Name:</label><br>
      <input type="text" name="members[{{ i }}][name]" required><br>

      <label>🕵️ Is Guest?</label>
      <input type="checkbox" name="members[{{ i }}][is_guest]" value="true"><br><br>

      <div id="items-{{ i }}"></div>

      <button type="button" onclick="addItem({{ i }})">➕ Add Dish</button>
    </div>
    {% endfor %}

    <hr>

    <label for="paid_by">💳 Who Paid?</label><br>
    <select name="paid_by" required>
      {% for i in range(group.num_members) %}
      <option value="{{ i }}">{{ request.form.get('members[' ~ i ~ '][name]', 'Member ' ~ (i + 1)) }}</option>
      {% endfor %}
    </select>

    <br><br>

    <label for="tax">💸 Tax Amount:</label><br>
    <input type="number" name="tax" step="0.01" min="0">

    <br><br>

    <button type="submit">✅ Submit Bill</button>
  </form>

  <script>
    function addItem(memberIndex) {
      const container = document.getElementById('items-' + memberIndex);
      const itemIndex = container.children.length;

      const html = `
        <div class="item-entry">
          <label>🍽️ Item Name:</label><br>
          <input type="text" name="members[${memberIndex}][items][${itemIndex}][name]" required><br>

          <label>💰 Price (PKR):</label><br>
          <input type="number" step="0.01" name="members[${memberIndex}][items][${itemIndex}][price]" required><br>

          <label>🔢 Share (e.g. 1 for full, 0.5 for half):</label><br>
          <input type="number" step="0.01" name="members[${memberIndex}][items][${itemIndex}][share]" required><br><br>
        </div>
      `;

      container.insertAdjacentHTML('beforeend', html);
    }
  </script>
</body>

</html>
